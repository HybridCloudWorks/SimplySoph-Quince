# Routine version updates, grouped and monthly so the owner merges a few PRs at most.
# Security updates are separate and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci-cd]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    # The API runs the Node major that package.json engines and CI use (24).
    # Moving to a new major is a deliberate change, not a routine update.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
