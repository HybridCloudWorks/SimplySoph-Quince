name: Something on the website isn't working
description: A page, link, sign-in, RSVP or admin screen behaves wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Please **don't** paste guest names, phone numbers, email addresses, invitation links or codes. Describe them instead ("a household with two guests").
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, without any invitation code.
      placeholder: https://misxv.simplysoph.com/es/rsvp/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open …
        2. Press …
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone, Safari
