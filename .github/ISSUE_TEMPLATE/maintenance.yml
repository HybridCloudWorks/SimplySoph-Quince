name: Maintenance task
description: Repository health, security, documentation or clean-up work for the workboard.
body:
  - type: textarea
    id: found
    attributes:
      label: What was found
      description: Include the evidence (files, lines, commands). Never paste secrets or guest data; redact them.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Recommended action and acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: gate
    attributes:
      label: Owner approval needed?
      options:
        - "No"
        - Repository owner
        - Organization owner
        - Elevated permissions
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation before closing
