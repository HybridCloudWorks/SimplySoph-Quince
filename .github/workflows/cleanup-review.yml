name: Prepare event cleanup review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run cleanup:plan
      - name: Show checklist in workflow summary
        run: cat work/cleanup/plan.md >> "$GITHUB_STEP_SUMMARY"
