name: Prepare event cleanup review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run cleanup:plan
      - name: Show checklist in workflow summary
        run: cat work/cleanup/plan.md >> "$GITHUB_STEP_SUMMARY"
