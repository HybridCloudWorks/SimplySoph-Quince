name: Website and service checks
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
  deploy:
    name: Publish production website
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: misxv-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # This job can mint the deploy token, so dependency install scripts never run here.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Authenticate with short-lived GitHub identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: simplysoph-66c78
          workload_identity_provider: projects/424903425639/locations/global/workloadIdentityPools/misxv-github/providers/github
          service_account: misxv-hosting-deploy@simplysoph-66c78.iam.gserviceaccount.com
      - name: Publish and verify the checked commit
        run: node scripts/deploy-hosting.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
