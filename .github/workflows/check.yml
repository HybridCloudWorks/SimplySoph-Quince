name: Website and service checks
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
  # The same checks with the clock moved to dates the site goes through
  # (scripts/test-at.mjs): a test that reads the real clock fails here, on the
  # pull request, instead of failing `check` on the night the calendar
  # reaches that date (R-008). docs/publishing.md has the full list.
  clock:
    name: Checks at ${{ matrix.at }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        at:
          - '2026-11-16T10:00:00-06:00'
          - '2027-01-15T21:15:00-06:00'
          - '2027-01-16T10:00:00-06:00'
          - '2028-01-20T12:00:00-06:00'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test-at.mjs
        env:
          FAKE_NOW: ${{ matrix.at }}
  deploy:
    name: Publish production website
    # Only `check`, not `clock`: `check` proves this commit at today's date,
    # which is what gets published. `clock` runs beside it on every pull
    # request and push, so a date-dependent test is caught before it merges,
    # while a re-publish on the night of a boundary neither waits for four
    # more runs nor is held up by a test about another date.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only main may deploy to this environment (its deployment branch policy).
    environment:
      name: production
      url: https://misxv.simplysoph.com
    concurrency:
      group: misxv-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # This job can mint the deploy token, so dependency install scripts never run here.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Authenticate with short-lived GitHub identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: simplysoph-66c78
          workload_identity_provider: projects/424903425639/locations/global/workloadIdentityPools/misxv-github/providers/github
          service_account: misxv-hosting-deploy@simplysoph-66c78.iam.gserviceaccount.com
      - name: Publish and verify the checked commit
        run: node scripts/deploy-hosting.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
