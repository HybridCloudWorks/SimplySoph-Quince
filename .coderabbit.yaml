# CodeRabbit configuration. Uses only settings available on the free
# open-source plan (public repository); no paid add-ons are enabled.
# Note: public repositories with fewer than 10 stars still require reviews to
# be triggered manually (comment "@coderabbitai review" on the PR); once the
# repository passes 10 stars the auto_review settings below take effect.
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: true
  path_filters:
    - "!package-lock.json"
    - "!dist/**"
chat:
  auto_reply: true
